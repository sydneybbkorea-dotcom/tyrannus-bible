<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline</title>
    <style>
        :root {
            --background: #fafafa;
            --text-primary: #171717;
            --text-secondary: #666;
            --button-bg: #000;
            --button-text: #fff;
            --button-hover: #333;
            --wave-gradient-1: rgba(0, 0, 0, 0.02);
            --wave-gradient-2: rgba(0, 0, 0, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #171717;
                --text-primary: #fff;
                --text-secondary: #a1a1a1;
                --button-bg: #fff;
                --button-text: #000;
                --button-hover: #e5e5e5;
                --wave-gradient-1: rgba(255, 255, 255, 0.02);
                --wave-gradient-2: rgba(255, 255, 255, 0.05);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-color: var(--background);
            color: var(--text-primary);

        }

        .container {
            max-width: 400px;
            text-align: center;

        }

        .icon {
            width: 64px;
            height: 64px;
            margin-bottom: 1.5rem;
            color: var(--text-secondary);

        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        button {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;

        }

        button:hover {
            background-color: var(--button-hover);
        }



        .wave {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(180deg, var(--wave-gradient-1) 0%, var(--wave-gradient-2) 100%);
            border-top-left-radius: 50% 20%;
            border-top-right-radius: 50% 20%;

        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12" y2="20"></line>
        </svg>
        <h1>No Internet Connection</h1>
        <p>Check your connection and try again. Your data will be automatically synchronized when you're back online.</p>
        <a onclick="window.location.href = document.referrer" style="text-decoration: none; display: inline-block;">
            <button>Try Again</button>
        </a>
    </div>
    <div class="wave"></div>
</body>
</html>
